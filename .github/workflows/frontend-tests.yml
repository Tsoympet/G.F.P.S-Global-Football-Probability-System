name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'GFPS/desktop/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'GFPS/desktop/**'
      - '.github/workflows/frontend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        check-latest: true
        cache: 'npm'
        cache-dependency-path: GFPS/desktop/package-lock.json
    
    - name: Install dependencies
      run: |
        cd GFPS/desktop
        npm ci
    
    - name: Run TypeScript type check
      run: |
        cd GFPS/desktop
        npx tsc --noEmit
    
    - name: Run tests
      run: |
        cd GFPS/desktop
        npm test -- --run
