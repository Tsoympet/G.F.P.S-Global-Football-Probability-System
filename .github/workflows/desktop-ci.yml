name: Desktop CI

on:
  pull_request:
    paths:
      - 'GFPS/desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  test-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GFPS/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: GFPS/desktop/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Build renderer
        run: npm run build
