name: Desktop CI

on:
  pull_request:
    paths:
      - 'GFPS/desktop/**'
      - '.github/workflows/desktop-ci.yml'

permissions:
  contents: read

jobs:
  test-desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GFPS/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          check-latest: true
          cache: 'npm'
          cache-dependency-path: GFPS/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: GFPS/desktop/src-tauri
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export NEEDRESTART_SUSPEND=1
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install deps
        run: npm ci --workspace=GFPS/desktop
      - name: Lint
        working-directory: GFPS/desktop
        run: npm run lint
      - name: Run unit tests
        working-directory: GFPS/desktop
        run: npm test
      - name: Dry Tauri build
        env:
          TAURI_APP_VERSION: 0.0.0-ci
        working-directory: GFPS/desktop
        run: npm run tauri:build -- --bundles deb,appimage
