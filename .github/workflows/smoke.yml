name: Smoke Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Initialize database
        run: python -m scripts.init_db

      - name: Launch backend
        env:
          SECRET_KEY: test-secret-key-for-smoke-tests-only
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend health
        run: |
          # Wait up to 30 seconds for backend to become healthy
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... (attempt $i/30)"
            sleep 1
          done
          echo "Backend failed to become healthy"
          exit 1

      - name: Check backend is running
        run: |
          if ! kill -0 $(cat backend.pid) 2>/dev/null; then
            echo "Backend process has died!"
            echo "=== Backend logs ==="
            cat backend.log 2>/dev/null || echo "No logs found"
            exit 1
          fi
          echo "Backend process is still running (PID: $(cat backend.pid))"

      - name: Seed auth user
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y jq
          echo "=== Attempting signup ==="
          SIGNUP=$(curl -s -X POST -H "Content-Type: application/json" -d '{"email":"ci@gfps.app","password":"password"}' http://127.0.0.1:8000/auth/signup)
          echo "Signup response: $SIGNUP"
          TOKEN=$(echo "$SIGNUP" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "=== Attempting login ==="
            LOGIN=$(curl -s -X POST -H "Content-Type: application/json" -d '{"email":"ci@gfps.app","password":"password"}' http://127.0.0.1:8000/auth/login)
            echo "Login response: $LOGIN"
            TOKEN=$(echo "$LOGIN" | jq -r '.token // empty')
          fi
          echo "Extracted token: $TOKEN"
          if [ -z "$TOKEN" ]; then
            echo "Failed to acquire token" && exit 1
          fi
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Hit smoke endpoints
        env:
          TOKEN: ${{ env.TOKEN }}
        run: |
          curl -sf http://127.0.0.1:8000/health
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/fixtures
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/live-odds
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/predictions
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8000/value-bets

      - name: Shutdown backend
        run: |
          kill $(cat backend.pid)
