name: Desktop Installers

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'GFPS/desktop/**'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'GFPS/desktop/**'
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate:
    # Run validation on push/PR but not on tag releases
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GFPS/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
          cache: 'npm'
          cache-dependency-path: GFPS/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: GFPS/desktop/src-tauri
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export NEEDRESTART_SUSPEND=1
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        working-directory: .
        run: npm ci --workspace=GFPS/desktop
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Dry Tauri build
        env:
          TAURI_APP_VERSION: 0.0.0-ci
        run: npm run tauri:build -- --bundles deb,appimage

  build:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: GFPS/desktop
    steps:
      - uses: actions/checkout@v6

      - name: Determine channel from tag
        id: channel
        shell: bash
        run: |
          REF="${GITHUB_REF}"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "refs/heads/main" || "$REF" == "refs/heads/master" ]]; then
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid release ref format: $REF" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true
          cache: 'npm'
          cache-dependency-path: GFPS/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: GFPS/desktop/src-tauri
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          export NEEDRESTART_SUSPEND=1
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        working-directory: .
        run: npm ci --workspace=GFPS/desktop
      - name: Build installers
        uses: tauri-apps/tauri-action@v0.4.0
        env:
          TAURI_WINDOWS_CERT_THUMBPRINT: ${{ secrets.TAURI_WINDOWS_CERT_THUMBPRINT }}
          TAURI_MACOS_IDENTITY: ${{ secrets.TAURI_MACOS_IDENTITY }}
        with:
          projectPath: GFPS/desktop
          tauriScript: npm run tauri:build
      - name: Collect installers
        shell: bash
        run: |
          ROOT="${GITHUB_WORKSPACE}/GFPS/desktop"
          INSTALLERS_DIR="${ROOT}/installers/${{ matrix.os }}"
          BUNDLE_DIR="${ROOT}/src-tauri/target/release/bundle"
          mkdir -p "${INSTALLERS_DIR}"
          if [ ! -d "${BUNDLE_DIR}" ]; then
            echo "Bundle output not found at ${BUNDLE_DIR}" >&2
            exit 1
          fi
          if [ -z "$(ls -A "${BUNDLE_DIR}" 2>/dev/null)" ]; then
            echo "No installer artifacts found in ${BUNDLE_DIR}" >&2
            exit 1
          fi
          cp -R "${BUNDLE_DIR}"/. "${INSTALLERS_DIR}"/
      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gfps-desktop-${{ matrix.os }}-${{ steps.channel.outputs.channel }}
          path: GFPS/desktop/installers/${{ matrix.os }}/**/*
