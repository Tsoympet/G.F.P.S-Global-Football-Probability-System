name: Desktop Installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: GFPS/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: GFPS/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_WINDOWS_CERT_THUMBPRINT: ${{ secrets.TAURI_WINDOWS_CERT_THUMBPRINT }}
          TAURI_MACOS_IDENTITY: ${{ secrets.TAURI_MACOS_IDENTITY }}
        with:
          projectPath: GFPS/desktop
          tauriScript: npm run tauri:build
      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfps-desktop-${{ matrix.os }}
          path: GFPS/desktop/**/bundle/**/*
