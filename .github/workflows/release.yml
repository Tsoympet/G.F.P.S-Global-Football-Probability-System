name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Determine channel from tag
        id: channel
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid release tag format: $TAG" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          check-latest: true
          cache: "npm"
          cache-dependency-path: GFPS/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: GFPS/desktop
        run: npm ci

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: GFPS/desktop/src-tauri

      - name: Build release notes
        id: notes
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          CHANNEL_TITLE=${RELEASE_CHANNEL^}
          TAG_PATTERN='v[0-9]*\.[0-9]*\.[0-9]*'
          CURRENT_TAG="${GITHUB_REF_NAME}"
          FALLBACK_COMMIT_COUNT=20
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            TAG_PATTERN='v[0-9]*\.[0-9]*\.[0-9]*-beta\.[0-9]*'
          fi

          PREVIOUS_TAG=$(git tag --list "$TAG_PATTERN" --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty='- %s' "${PREVIOUS_TAG}..HEAD")
          else
            CHANGELOG=$(git log --pretty='- %s' -n "$FALLBACK_COMMIT_COUNT")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- See commit history for full changes."
          fi

          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            RISK_LINE="⚠️ Experimental build; features may change and issues may be present."
          else
            RISK_LINE="✅ Fully tested release intended for all users."
          fi

          {
            echo "## Channel: ${CHANNEL_TITLE}"
            echo ""
            echo "### Major changes:"
            echo "${CHANGELOG}"
            echo ""
            echo "### Important:"
            echo "${RISK_LINE}"
            echo ""
            echo "---"
            echo ""
            echo "Download the appropriate installer for your platform:"
            echo "- **Windows**: Download the \`.msi\` file"
            echo "- **macOS**: Download the \`.dmg\` file"
            echo "- **Linux**: Download the \`.AppImage\` file"
          } > release_notes.md
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          cat release_notes.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          
          # Set release title
          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            echo "title=GFPS Desktop ${CURRENT_TAG} (Beta)" >> "$GITHUB_OUTPUT"
          else
            echo "title=GFPS Desktop ${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: GFPS/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.notes.outputs.title }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.channel.outputs.channel == 'beta' }}
          args: ${{ matrix.args }}
